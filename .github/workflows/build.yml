name: Build APK

on:
  workflow_dispatch:   # adds the "Run workflow" button
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The debug key is kept in the repo so every build has the same signature
      # (a new key per build makes Android refuse to install it over the old app).
      - name: Check debug keystore
        run: test -f debug.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Doppler-debug-apk
          path: app/build/outputs/apk/debug/*.apk
